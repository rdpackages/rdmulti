[metadata]
name = rdmulti
version = 2.0.0
author = Matias D. Cattaneo, Ricardo Masini, Rocio Titiunik, Gonzalo Vazquez-Bare
author_email = matias.d.cattaneo@gmail.com, ricardo.masini@gmail.com, rocio.titiunik@gmail.com, gvazquezbare@gmail.com
maintainer = Matias D. Cattaneo
maintainer_email = matias.d.cattaneo@gmail.com
license = GPL-3.0-only
license_files = LICENSE.md
description = Robust Local Polynomial Methods for RD designs with Multiple Cutoffs or Multiple Scores
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/rdpackages/rdmulti
project_urls =
    Bug Tracker = https://github.com/rdpackages/rdmulti/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy
    pandas>=2.0.0
    scipy
    rdrobust>=2.0.0

[options.packages.find]
where = src
